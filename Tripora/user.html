<!DOCTYPE html>
<html>
<head>
    <title>Travel Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dashboard">

<div class="overlay"></div>

<div class="page">

    <div class="topbar">

        <h1>✈️ Travel Booking</h1>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <div class="welcome">

        <h2>
            Welcome, <span id="welcomeUser"></span>
        </h2>

        <p>
            Where would you like to go?
        </p>

    </div>

    <div class="service-grid">

        <div
            class="service-card"
            onclick="goTransport('Train')">

            <h2>🚆 Train</h2>

            <p>Book train tickets</p>

        </div>

        <div
            class="service-card"
            onclick="goTransport('Bus')">

            <h2>🚌 Bus</h2>

            <p>Select your seat</p>

        </div>

        <div
            class="service-card"
            onclick="goTransport('Rapido')">

            <h2>🏍️ Rapido</h2>

            <p>Bike / Auto / Cab</p>

        </div>

        <div
            class="service-card"
            onclick="goTransport('Uber')">

            <h2>🚕 Uber</h2>

            <p>Auto / Go / Sedan</p>

        </div>

    </div>

    <div class="dashboard-buttons">

        <button onclick="location.href='mybookings.html'">
            My Bookings
        </button>

        <button onclick="showRecent()">
            Recent Searches
        </button>

    </div>

    <p id="dashboardMsg"></p>

</div>

<script src="script.js"></script>

<script>
    loadDashboard();
</script>

</body>
</html>
